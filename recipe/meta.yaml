{% set name = "numba" %}
{% set version = "0.66.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b900e63a0e26c05ea9a6d5a3a5a0a177cb64c5011887bf43edb8c3ed2c38d363
  patches:
    # Upstream 0.66.0 guards Python <3.15 exclusive; hatchery compiles 3.15.0rc1.
    - patches/0001-enable-python-3.15.patch

build:
  number: 0
  ignore_run_exports:
    # numpy is a Python import; DSOs live in numpy-base.
    - numpy
    # omppool links libgomp, not the mutex metapackage.
    - _openmp_mutex  # [linux]
    # libc++ comes from the macOS SDK, not conda libcxx.
    - libcxx  # [osx]
    # setup.py reports "OpenMP not found" on this osx worker; pin is unused.
    - llvm-openmp  # [osx]
  script:
    - export CC="${CC} -pthread"  # [linux]
    - export CXX="${CXX} -pthread"  # [linux]
    - {{ PYTHON }} -m pip install . --no-deps  --no-build-isolation --ignore-installed -vv
  entry_points:
    - numba = numba.misc.numba_entry:main
  skip: true  # [py<315 or py>=316]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - llvmlite 0.48.0
    - numpy {{ numpy }}
    - tbb-devel {{ tbb }}
    - llvm-openmp {{ cxx_compiler_version }}  # [osx or (win and arm64)]
    - libgomp        # [linux]
    - vcomp14        # [win and x86_64]
  run:
    - python
    - llvmlite >=0.48.0,<0.49
    # 0.66.0 upstream is numpy <2.5; testing-channel numpy is 2.5.2 (0.67.0 allows <2.6).
    # avoid 2.0.1 because of https://github.com/numpy/numpy/pull/27195
    - numpy >=1.22,<2.6,!=2.0.1
    - llvm-openmp {{ cxx_compiler_version }}  # [osx or (win and arm64)]
    - libgomp        # [linux]
    - vcomp14        # [win and x86_64]
  run_constrained:
    - tbb >={{ tbb }}
    # avoid confusion from openblas bugs
    - libopenblas !=0.3.6      # [x86_64]
    - libopenblas >=0.3.18, !=0.3.20  # [arm64]
    # CUDA 11.2 or later is required for CUDA support
    - cuda-version >=11.2
    - cudatoolkit >=11.2
    # scipy 1.0 or later
    - scipy >=1.0
    # CUDA Python 11.6 or later
    - cuda-python >=11.6

test:
  requires:
    - pip
    - jinja2
    # Required to test optional Numba features
    - cffi
    - scipy
    - ipython
    - ipykernel
    # for pycc
    - setuptools
    - pygments
    - pexpect
    - tbb
    # Need these for AOT.
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}

  imports:
    - numba
    - numba.core.annotations
    - numba.core.datamodel
    - numba.core.rewrites
    - numba.core.runtime
    - numba.core.typeconv
    - numba.core.typing
    - numba.core.unsafe
    - numba.cuda
    - numba.cuda.cudadrv
    - numba.cuda.kernels
    - numba.cuda.simulator
    - numba.cuda.simulator.cudadrv
    - numba.cuda.tests
    - numba.cuda.tests.cudadrv
    - numba.cuda.tests.data
    - numba.cuda.tests.cudapy
    - numba.cuda.tests.cudasim
    - numba.cuda.tests.nocuda
    - numba.experimental.jitclass
    - numba.np.ufunc
    - numba.pycc
    - numba.scripts
    - numba.testing
    - numba.tests
    - numba.tests.npyufunc

about:
  home: https://numba.pydata.org
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: NumPy aware dynamic Python compiler using LLVM
  description: |
    Numba is an Open Source NumPy-aware optimizing compiler for Python
    sponsored by Anaconda, Inc. It uses the remarkable LLVM compiler
    infrastructure to compile Python syntax to machine code."
  dev_url: https://github.com/numba/numba
  doc_url: https://numba.readthedocs.io

extra:
  recipe-maintainers:
    - souravsingh
    - marcelotrevisani
    - henryiii
    - mbargull
    - jakirkham
    - step21
