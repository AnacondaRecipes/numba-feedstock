{% set name = "numba" %}
{% set version = "0.68.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8a781de54b980b98f43bff7f1093701b5f07c80d031c7cfa8a87493d8bf73f2d

build:
  number: 0
  script:
    - export CC="${CC} -pthread"  # [linux]
    - export CXX="${CXX} -pthread"  # [linux]
    - {{ PYTHON }} -m pip install . --no-deps  --no-build-isolation --ignore-installed -vv
  entry_points:
    - numba = numba.misc.numba_entry:main
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    # llvmlite 0.50 is not on pkgs/main yet; resolved from the PBP graph channels in abs.yaml
    - llvmlite 0.50.0
    - numpy {{ numpy }}
    - tbb-devel {{ tbb }}  # analint: host_section_needs_exact_pinnings
    - llvm-openmp {{ cxx_compiler_version }}  # [osx]
    - llvm-openmp 20.1.8 # [win and arm64]
    - libgomp        # [linux] analint: host_section_needs_exact_pinnings  # OpenMP runtime provided by the compiler toolchain
    - vcomp14        # [win and x86_64] analint: host_section_needs_exact_pinnings  # OpenMP runtime provided by the compiler toolchain
  run:
    - python
    - llvmlite >=0.50.0,<0.51
    # avoid 2.0.1 because of https://github.com/numpy/numpy/pull/27195
    - numpy >=1.22,<2.6,!=2.0.1
    - llvm-openmp    # [osx or (win and arm64)]
    - libgomp        # [linux]
    - vcomp14        # [win and x86_64]
  run_constrained:
    - tbb >={{ tbb }}
    # avoid confusion from openblas bugs
    - libopenblas !=0.3.6      # [x86_64]
    - libopenblas >=0.3.18, !=0.3.20  # [arm64]
    # CUDA 11.2 or later is required for CUDA support
    - cuda-version >=11.2
    - cudatoolkit >=11.2
    # scipy 1.0 or later
    - scipy >=1.0
    # CUDA Python 11.6 or later
    - cuda-python >=11.6

test:
  requires:
    - pip
    - jinja2                   # [py<315]
    # Required to test optional Numba features
    - cffi                     # [py<315]
    - scipy                    # [py<315]
    - ipython                  # [py<315]
    - ipykernel                # [py<315]
    # for pycc
    - setuptools >=69.0.0
    - pygments                 # [py<315]
    - pexpect                  # [py<315]
    - tbb
    # Need these for AOT.
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}

  imports:
    - numba
    - numba.core.annotations
    - numba.core.datamodel
    - numba.core.rewrites
    - numba.core.runtime
    - numba.core.typeconv
    - numba.core.typing
    - numba.core.unsafe
    - numba.cuda
    - numba.cuda.cudadrv
    - numba.cuda.kernels
    - numba.cuda.simulator
    - numba.cuda.simulator.cudadrv
    - numba.cuda.tests
    - numba.cuda.tests.cudadrv
    - numba.cuda.tests.data
    - numba.cuda.tests.cudapy
    - numba.cuda.tests.cudasim
    - numba.cuda.tests.nocuda
    - numba.experimental.jitclass
    - numba.np.ufunc
    - numba.pycc
    - numba.scripts
    - numba.testing
    - numba.tests
    - numba.tests.npyufunc

about:
  home: https://numba.pydata.org
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: NumPy aware dynamic Python compiler using LLVM
  description: |
    Numba is an Open Source NumPy-aware optimizing compiler for Python
    sponsored by Anaconda, Inc. It uses the remarkable LLVM compiler
    infrastructure to compile Python syntax to machine code."
  dev_url: https://github.com/numba/numba
  doc_url: https://numba.readthedocs.io

extra:
  recipe-maintainers:
    - souravsingh
    - marcelotrevisani
    - henryiii
    - mbargull
    - jakirkham
    - step21
